spring:
  application:
    name: url-shortener
  datasource:
    # Defaults below are LOCAL DEV ONLY (they match docker-compose.yml's disposable container) and are
    # NOT production secrets. Override DB_URL / DB_USERNAME / DB_PASSWORD via environment variables (or a
    # secrets manager) in any real environment — the app reads them from the environment first.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must not create or alter it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  # Base URL used to build returned short links (no trailing slash needed).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # HTTP status used for redirects (302 temporary by default; set 301 for permanent).
  redirect-status: ${APP_REDIRECT_STATUS:302}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Do not expose database/component internals to unauthenticated callers.
      show-details: never
      probes:
        enabled: true
