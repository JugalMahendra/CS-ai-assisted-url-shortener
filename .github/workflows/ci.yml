name: CI
on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]
jobs:
    build:
      runs-on: ubuntu-latest   # GitHub-hosted runners provide Docker, so Testcontainers works
      steps:
        - uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven
        - name: Build and test (unit + Testcontainers integration)
          run: mvn -B -ntp verify
