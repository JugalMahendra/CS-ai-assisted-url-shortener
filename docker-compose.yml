services:
  db:
    image: postgres:16-alpine
    container_name: urlshortener-db
    # Local development credentials only — a disposable localhost container, NOT a production secret.
    # Real deployments supply these via environment variables / a secrets manager.
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
